<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三大法人籌碼追蹤</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0a0e14;
    --panel: #10151f;
    --panel-border: #1e2733;
    --text: #e6edf3;
    --muted: #7d8ba1;
    --accent: #00e5c7;
    --accent2: #7c5cff;
    --red: #ff4d6d;
    --green: #00e5a0;
    --amber: #ff9f43;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(circle at 20% -10%, #10203a 0%, var(--bg) 45%);
    color: var(--text);
    font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    padding: 16px;
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 16px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: inline-block;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  select, .range-btn {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .range-btn.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 8px rgba(0,229,199,0.3); }
  #status { color: var(--muted); font-size: 0.8rem; margin-bottom: 14px; }

  .snapshot {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 18px;
  }
  .snap-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 14px;
  }
  .snap-card .label { color: var(--muted); font-size: 0.75rem; margin-bottom: 6px; }
  .snap-card .value { font-size: 1.2rem; font-weight: 600; }

  h2.section-title {
    font-size: 0.95rem;
    color: var(--muted);
    margin: 20px 0 10px;
    font-weight: 500;
  }

  .verdict {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .verdict-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .verdict-head .title { font-size: 1rem; font-weight: 600; }
  .tag {
    font-size: 0.75rem;
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 600;
    white-space: nowrap;
  }
  .tag.bull { background: rgba(255,77,109,0.15); color: var(--red); }   /* 台股慣例紅漲=偏多 */
  .tag.bear { background: rgba(0,229,160,0.15); color: var(--green); } /* 綠跌=偏空 */
  .tag.neutral { background: rgba(255,159,67,0.15); color: var(--amber); }
  .verdict p { margin: 0; color: var(--text); line-height: 1.6; font-size: 0.9rem; }

  .up { color: var(--red); }
  .down { color: var(--green); }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>

<h1>⚡ 三大法人籌碼追蹤</h1>

<div class="controls">
  <select id="stockSelect"><option>載入中...</option></select>
  <div>
    <button class="range-btn" data-days="7">7天</button>
    <button class="range-btn active" data-days="30">30天</button>
    <button class="range-btn" data-days="90">90天</button>
  </div>
</div>
<div id="status"></div>

<div class="snapshot" id="snapshotCards"></div>

<h2 class="section-title">分析結論</h2>
<div id="verdicts"></div>

<script>
const SUPABASE_URL = "https://zfvowdwhwoticdjelzdl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpmdm93ZHdod290aWNkamVsemRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNTE1NTUsImV4cCI6MjEwNTYyNzU1NX0._o7csMpXSFhyJd0lWW6bnM-GznWUvmVfZsQQCnCWw_I";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const statusEl = document.getElementById("status");

let currentSymbol = null;
let currentDays = 30;

function fmtNum(n, digits = 0) {
  if (n === null || n === undefined) return "--";
  return Number(n).toLocaleString(undefined, { maximumFractionDigits: digits });
}

// 計算某欄位從最新一天往回算的連續同方向天數(以 >=0 / <0 判斷方向)
function classifyStreak(rows, field) {
  let streak = 0, dir = null;
  for (let i = rows.length - 1; i >= 0; i--) {
    const v = rows[i][field];
    if (v === null || v === undefined) break;
    const d = v >= 0 ? "buy" : "sell";
    if (dir === null) { dir = d; streak = 1; }
    else if (d === dir) { streak++; }
    else break;
  }
  return { dir, streak };
}

function computeMA(values, window) {
  return values.map((_, i) => {
    if (i < window - 1) return null;
    const slice = values.slice(i - window + 1, i + 1);
    if (slice.some(v => v === null || v === undefined)) return null;
    return slice.reduce((a, b) => a + b, 0) / window;
  });
}

function dirLabel(dir) {
  return dir === "buy" ? "買超" : dir === "sell" ? "賣超" : "—";
}

// ---- 載入自選股清單 ----
async function loadWatchlist() {
  const { data, error } = await client
    .from("watchlist")
    .select("symbol, name")
    .eq("is_active", true)
    .order("symbol");

  const select = document.getElementById("stockSelect");
  select.innerHTML = "";

  if (error || !data || data.length === 0) {
    select.innerHTML = "<option>沒有自選股</option>";
    statusEl.textContent = error ? "讀取 watchlist 失敗: " + error.message : "watchlist 是空的";
    return null;
  }

  data.forEach(row => {
    const opt = document.createElement("option");
    opt.value = row.symbol;
    opt.textContent = row.name ? `${row.symbol} ${row.name}` : row.symbol;
    select.appendChild(opt);
  });

  currentSymbol = data[0].symbol;
  select.value = currentSymbol;
  select.addEventListener("change", () => {
    currentSymbol = select.value;
    loadData();
  });
  return currentSymbol;
}

document.querySelectorAll(".range-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".range-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentDays = parseInt(btn.dataset.days, 10);
    loadData();
  });
});

// ---- 今日快照卡片 ----
function renderSnapshot(rows) {
  const el = document.getElementById("snapshotCards");
  el.innerHTML = "";
  if (!rows.length) {
    el.innerHTML = `<div class="empty">這個區間沒有資料</div>`;
    return;
  }
  const latest = rows[rows.length - 1];
  const changeClass = (latest.change_percent || 0) >= 0 ? "up" : "down";

  const cards = [
    {
      label: "收盤價",
      value: fmtNum(latest.close_price, 2) + ` <span class="${changeClass}">${latest.change_percent ?? "--"}%</span>`,
    },
    {
      label: "今日高/低",
      value: fmtNum(latest.high_price, 2) + " / " + fmtNum(latest.low_price, 2),
    },
    {
      label: "本益比",
      value: latest.pe_ratio !== null && latest.pe_ratio !== undefined ? fmtNum(latest.pe_ratio, 2) + " 倍" : "--",
    },
    {
      label: "外資持股 / 尚可投資",
      value: (latest.foreign_holding_ratio !== null && latest.foreign_holding_ratio !== undefined ? latest.foreign_holding_ratio.toFixed(2) + "%" : "--")
        + " / " + (latest.foreign_investable_ratio !== null && latest.foreign_investable_ratio !== undefined ? latest.foreign_investable_ratio.toFixed(2) + "%" : "--"),
    },
  ];

  cards.forEach(c => {
    const div = document.createElement("div");
    div.className = "snap-card";
    div.innerHTML = `<div class="label">${c.label}</div><div class="value">${c.value}</div>`;
    el.appendChild(div);
  });
}

// ---- 分析結論 ----
function renderVerdicts(rows) {
  const el = document.getElementById("verdicts");
  el.innerHTML = "";
  if (!rows.length) return;

  const latest = rows[rows.length - 1];

  // 1. 籌碼面:外資 vs 投信方向是否一致
  const foreignS = classifyStreak(rows, "foreign_net");
  const trustS = classifyStreak(rows, "trust_net");
  let chipTag = "neutral", chipTitle = "籌碼面:方向不一致";
  let chipText = `外資近期${dirLabel(foreignS.dir)}(連續 ${foreignS.streak} 天),投信近期${dirLabel(trustS.dir)}(連續 ${trustS.streak} 天),兩者方向不一致,籌碼訊號不明確,建議搭配其他面向判斷。`;
  if (foreignS.dir && foreignS.dir === trustS.dir) {
    if (foreignS.dir === "buy") {
      chipTag = "bull"; chipTitle = "籌碼面:外資投信同步買超";
      chipText = `外資與投信同步買超,外資連續買超 ${foreignS.streak} 天,投信連續買超 ${trustS.streak} 天,籌碼面偏多。`;
    } else {
      chipTag = "bear"; chipTitle = "籌碼面:外資投信同步賣超";
      chipText = `外資與投信同步賣超,外資連續賣超 ${foreignS.streak} 天,投信連續賣超 ${trustS.streak} 天,籌碼面偏空。`;
    }
  }

  // 2. 技術面:月線乖離
  const closes = rows.map(r => r.close_price);
  const ma20Series = computeMA(closes, 20);
  const latestMA20 = ma20Series[ma20Series.length - 1];
  let techTag = "neutral", techTitle = "技術面:資料不足", techText = "區間內資料不足 20 天,無法計算月線乖離率。";
  if (latestMA20 !== null && latestMA20 !== undefined && latestMA20 !== 0) {
    const dev = ((latest.close_price - latestMA20) / latestMA20) * 100;
    const devAbs = Math.abs(dev);
    if (dev >= 0) {
      techTag = devAbs >= 5 ? "neutral" : "bull";
      techTitle = devAbs >= 5 ? "技術面:站上月線但乖離過大" : "技術面:股價站穩月線之上";
      techText = `收盤價 ${fmtNum(latest.close_price, 2)} 在月線(20日均價 ${fmtNum(latestMA20, 2)})之上,乖離率 +${dev.toFixed(2)}%。`
        + (devAbs >= 5 ? " 乖離幅度較大,短線可能偏熱,留意拉回風險。" : " 乖離幅度在合理範圍內。");
    } else {
      techTag = devAbs >= 5 ? "bear" : "neutral";
      techTitle = devAbs >= 5 ? "技術面:跌破月線且乖離過大" : "技術面:股價在月線之下";
      techText = `收盤價 ${fmtNum(latest.close_price, 2)} 在月線(20日均價 ${fmtNum(latestMA20, 2)})之下,乖離率 ${dev.toFixed(2)}%。`
        + (devAbs >= 5 ? " 乖離幅度較大,短線可能偏弱,留意是否有超跌反彈機會。" : " 乖離幅度在合理範圍內。");
    }
  }

  // 3. 估值面:本益比在區間內的相對位置
  const peValues = rows.map(r => r.pe_ratio).filter(v => v !== null && v !== undefined);
  let valTag = "neutral", valTitle = "估值面:資料不足", valText = "這個區間內沒有本益比資料。";
  if (peValues.length >= 3 && latest.pe_ratio !== null && latest.pe_ratio !== undefined) {
    const minPE = Math.min(...peValues);
    const maxPE = Math.max(...peValues);
    const avgPE = peValues.reduce((a, b) => a + b, 0) / peValues.length;
    let position = "中間";
    if (maxPE > minPE) {
      const pct = (latest.pe_ratio - minPE) / (maxPE - minPE);
      position = pct <= 0.33 ? "相對低檔" : pct >= 0.67 ? "相對高檔" : "區間中段";
    }
    valTag = position === "相對低檔" ? "bear" : position === "相對高檔" ? "bull" : "neutral";
    valTitle = `估值面:本益比處於區間${position}`;
    valText = `目前本益比 ${latest.pe_ratio.toFixed(2)} 倍,區間內落在 ${minPE.toFixed(2)}~${maxPE.toFixed(2)} 倍之間(平均 ${avgPE.toFixed(2)} 倍),屬於${position}。`;
  }

  // 4. 外資動向:持股比率變化趨勢
  const holdingSeries = rows.map(r => r.foreign_holding_ratio).filter(v => v !== null && v !== undefined);
  let fTag = "neutral", fTitle = "外資動向:資料不足", fText = "這個區間內沒有外資持股比率資料。";
  if (holdingSeries.length >= 2) {
    const first = holdingSeries[0];
    const last = holdingSeries[holdingSeries.length - 1];
    const diff = last - first;
    const investable = latest.foreign_investable_ratio;
    fTag = diff > 0.1 ? "bull" : diff < -0.1 ? "bear" : "neutral";
    fTitle = diff > 0.1 ? "外資動向:持股比率上升" : diff < -0.1 ? "外資動向:持股比率下降" : "外資動向:持股比率持平";
    fText = `外資持股比率從 ${first.toFixed(2)}% 變化到 ${last.toFixed(2)}%(區間內${diff >= 0 ? "上升" : "下降"} ${Math.abs(diff).toFixed(2)} 個百分點)。`
      + (investable !== null && investable !== undefined ? ` 目前尚可投資空間約 ${investable.toFixed(2)}%。` : "");
  }

  const verdicts = [
    { tag: chipTag, title: chipTitle, text: chipText },
    { tag: techTag, title: techTitle, text: techText },
    { tag: valTag, title: valTitle, text: valText },
    { tag: fTag, title: fTitle, text: fText },
  ];

  const tagLabel = { bull: "偏多", bear: "偏空", neutral: "中性" };

  verdicts.forEach(v => {
    const div = document.createElement("div");
    div.className = "verdict";
    div.innerHTML = `
      <div class="verdict-head">
        <span class="title">${v.title}</span>
        <span class="tag ${v.tag}">${tagLabel[v.tag]}</span>
      </div>
      <p>${v.text}</p>
    `;
    el.appendChild(div);
  });
}

async function loadData() {
  if (!currentSymbol) return;
  statusEl.textContent = `讀取 ${currentSymbol} 的資料中...`;

  const since = new Date();
  since.setDate(since.getDate() - currentDays);
  const sinceStr = since.toISOString().slice(0, 10);

  const { data, error } = await client
    .from("daily_data")
    .select("date, close_price, change_percent, open_price, high_price, low_price, pe_ratio, foreign_net, trust_net, dealer_net, institutional_net, foreign_holding_ratio, foreign_investable_ratio")
    .eq("symbol", currentSymbol)
    .eq("market", "TW")
    .gte("date", sinceStr)
    .order("date", { ascending: true });

  if (error) {
    statusEl.textContent = "讀取 daily_data 失敗: " + error.message;
    return;
  }

  statusEl.textContent = `${currentSymbol} 共 ${data.length} 筆資料`;
  renderSnapshot(data || []);
  renderVerdicts(data || []);
}

(async function init() {
  await loadWatchlist();
  await loadData();
})();
</script>
</body>
</html>
